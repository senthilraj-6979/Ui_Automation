# Available Browsers: chrome, firefox, safari
# Default: chrome
# Usage: chrome (default), firefox, safari

# Choose Browser
# IMPORTANT: Make sure the browser is installed on your system
# ? Chrome - Built-in support (recommended)
# ? Safari - Built-in on macOS (enable automation first)
# ? Firefox - Optional (install separately if needed)

browser = firefox

# Headless Mode: true or false
# Set to true to run in headless mode (no UI)
# Set to false to run with visible UI
headless = true
